# Before first `docker compose up`, generate the internal mTLS certs:
#   ./scripts/generate-internal-certs.sh
#
# Only `gateway` publishes a port (bound to loopback only - see below), and
# only to make local testing easy; the two AI services are reachable only
# from other containers on the `internal` network, and every hop between
# gateway and an AI service is mutual TLS (see docs/AI_FEATURE.md). For a
# real public deployment, run with `--profile proxy` to also start the
# TLS-terminating reverse proxy in front of the gateway - see deploy/Caddyfile.

services:
  gateway:
    build: .
    image: urdu-app-gateway:local
    ports:
      # Loopback-only: reachable as http://localhost:3000 for local testing,
      # but not exposed on the host's public network interfaces. Real
      # external traffic should come in through the `reverse-proxy` service
      # (--profile proxy), which terminates public HTTPS.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      TRANSCRIPTION_SERVICE_URL: https://transcription:8001
      TRANSLATION_SERVICE_URL: https://translation:8002
      INTERNAL_TLS_ENABLED: "true"
      INTERNAL_TLS_CLIENT_CERT_FILE: /certs/gateway-client.crt
      INTERNAL_TLS_CLIENT_KEY_FILE: /certs/gateway-client.key
      INTERNAL_TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
      # Persistent recording history (SQLite DB + permanent MP3 audio) and
      # the transient multipart-upload staging directory - see
      # docs/AI_FEATURE.md for the data-retention policy this implies.
      - gateway-data:/app/data
      - gateway-recordings:/app/recordings
      - gateway-uploads:/app/uploads
    depends_on:
      - transcription
      - translation
    networks:
      - internal
    restart: unless-stopped
    read_only: false # writes to ./uploads (transient), ./data and ./recordings (persistent)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  transcription:
    build: ./ai-services/transcription
    image: urdu-transcription-service:local
    env_file:
      - .env
    environment:
      # Both services share one .env file, so a key defined in it (like
      # SERVICE_PORT) can only have one value across both containers - these
      # overrides are what actually make the two services' ports differ,
      # regardless of what .env itself contains.
      SERVICE_PORT: "8001"
      TLS_ENABLED: "true"
      TLS_CERT_FILE: /certs/transcription-server.crt
      TLS_KEY_FILE: /certs/transcription-server.key
      TLS_CLIENT_CA_FILE: /certs/ca.crt
      # Reused only by this container's own Docker healthcheck (calling its
      # own /health over TLS, which - like any client - needs a cert once
      # mTLS is enforced). Grants no inbound access; it's a client cert.
      INTERNAL_TLS_CLIENT_CERT_FILE: /certs/gateway-client.crt
      INTERNAL_TLS_CLIENT_KEY_FILE: /certs/gateway-client.key
    volumes:
      - ./certs:/certs:ro
    networks:
      - internal
    restart: unless-stopped
    # Healthcheck logic (including the TLS_ENABLED branch) lives in the
    # image's own Dockerfile HEALTHCHECK (healthcheck.sh) - not overridden here.
    deploy:
      resources:
        limits:
          memory: 512M

  translation:
    build: ./ai-services/translation
    image: urdu-translation-service:local
    env_file:
      - .env
    environment:
      # See the same note on the transcription service above.
      SERVICE_PORT: "8002"
      TLS_ENABLED: "true"
      TLS_CERT_FILE: /certs/translation-server.crt
      TLS_KEY_FILE: /certs/translation-server.key
      TLS_CLIENT_CA_FILE: /certs/ca.crt
      INTERNAL_TLS_CLIENT_CERT_FILE: /certs/gateway-client.crt
      INTERNAL_TLS_CLIENT_KEY_FILE: /certs/gateway-client.key
    volumes:
      - ./certs:/certs:ro
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional public-facing TLS termination: `docker compose --profile proxy up -d`.
  # Set PUBLIC_DOMAIN to a real domain pointing at this host for Caddy to
  # automatically obtain a Let's Encrypt certificate; left at the default
  # ("localhost") it uses Caddy's own locally-trusted certificate instead,
  # suitable for internal/testing use only. See deploy/Caddyfile.
  reverse-proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
    networks:
      - internal
      - public
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    # Egress is needed on every request: the transcription/translation
    # containers call the OpenAI API for every transcribe/translate request,
    # not just at startup. It is not set to `internal: true` because that
    # would cut off that route out; the bearer-token auth, per-service mTLS,
    # and the fact that no port is published are the controls actually
    # protecting this network from the inside.
    internal: false
  public:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  gateway-data:
  gateway-recordings:
  gateway-uploads:
